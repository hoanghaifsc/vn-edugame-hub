<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <link rel="manifest" href="/manifest.json" />
    <title>Vietnam EduGame Hub</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; color: #333; }
      #root { min-height: 100vh; }

      /* ── Pages layout ── */
      .student-home, .teacher-dashboard, .parent-dashboard {
        max-width: 960px; margin: 0 auto; padding: 24px 16px;
      }

      /* ── Home header ── */
      .home-header {
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; color: #fff;
      }
      .home-header__text h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
      .home-header__text p  { margin: 0; font-size: 14px; opacity: .85; }
      .home-header__avatar  {
        width: 48px; height: 48px; border-radius: 50%;
        background: rgba(255,255,255,.25); display: flex; align-items: center;
        justify-content: center; font-size: 22px; font-weight: 800; flex-shrink: 0;
      }

      /* ── Subject filter ── */
      .subject-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
      .subject-filter button {
        padding: 7px 18px; border-radius: 99px; border: 2px solid #e0e0e0;
        background: #fff; cursor: pointer; font-size: 13px; color: #555;
        transition: all .15s; font-weight: 600;
      }
      .subject-filter button:hover { border-color: #1a73e8; color: #1a73e8; }
      .subject-filter button.active {
        background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 700;
        box-shadow: 0 2px 8px rgba(26,115,232,.35);
      }

      /* ── Game grid ── */
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
      }
      .game-card {
        background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 2px 10px rgba(0,0,0,.07); transition: transform .18s, box-shadow .18s;
        position: relative; display: flex; flex-direction: column;
      }
      .game-card--playable:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.13); }
      .game-card--soon { opacity: .6; }
      .game-card img { width: 100%; display: block; height: 130px; object-fit: cover; }
      .game-card__body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; }
      .game-card__meta { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      .game-card h3  { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
      .game-card p   { margin: 0 0 12px; font-size: 13px; color: #666; line-height: 1.5; flex: 1; }

      .subject-tag {
        display: inline-block; padding: 2px 10px;
        background: #e8f0fe; color: #1a73e8; border-radius: 99px; font-size: 11px; font-weight: 700;
      }
      .grade-tag {
        display: inline-block; padding: 2px 10px;
        background: #fce8e6; color: #ea4335; border-radius: 99px; font-size: 11px; font-weight: 700;
      }
      .badge-new {
        position: absolute; top: 10px; right: 10px;
        background: #34a853; color: #fff; font-size: 11px; font-weight: 700;
        padding: 3px 10px; border-radius: 99px;
        box-shadow: 0 2px 6px rgba(52,168,83,.4);
      }
      .play-btn {
        display: block; width: 100%;
        padding: 10px 0; border: none; border-radius: 8px;
        background: #1a73e8; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
        transition: background .15s;
      }
      .play-btn:hover:not(:disabled) { background: #1557b0; }
      .play-btn:disabled { background: #e0e0e0; cursor: default; color: #aaa; }

      /* ── Empty state ── */
      .empty-state {
        text-align: center; padding: 48px 0; color: #aaa;
      }
      .empty-state__icon { font-size: 48px; display: block; margin-bottom: 12px; }
      .empty-state p { font-size: 15px; margin: 0; }

      /* ── Banners ── */
      .offline-banner { background: #ea4335; color: #fff; text-align: center; padding: 8px; font-size: 13px; }
      .sync-banner    { background: #fbbc04; color: #333; text-align: center; padding: 8px; font-size: 13px; }
      .success-msg    { color: #34a853; font-weight: 700; margin-top: 8px; }

      /* ── Teacher tabs ── */
      .tab-nav { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
      .tab-nav button {
        padding: 10px 24px; border: none; background: none; font-size: 15px;
        color: #888; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
      }
      .tab-nav button.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 700; }

      /* ── Forms ── */
      form label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
      form label input, form label select {
        display: block; width: 100%; margin-top: 4px; padding: 8px 10px;
        border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
      }
      form button[type=submit] {
        padding: 10px 28px; background: #1a73e8; color: #fff;
        border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
      }
      form button:disabled { background: #aaa; }

      /* ── Tables ── */
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
      th { background: #f1f3f4; font-weight: 700; color: #555; }
      tr:last-child td { border-bottom: none; }

      /* ── Parent overview cards ── */
      .overview-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; margin-bottom: 24px; }
      .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
      .card h3 { margin: 0 0 8px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
      .metric { margin: 0; font-size: 28px; font-weight: 900; color: #1a73e8; }

      /* ── Trends ── */
      .trend { font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
      .trend-up     { background: #e6f4ea; color: #34a853; }
      .trend-down   { background: #fce8e6; color: #ea4335; }
      .trend-stable { background: #f1f3f4; color: #777; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
